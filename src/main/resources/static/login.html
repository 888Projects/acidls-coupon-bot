<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>AcidCouponBot — Sign In</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet"/>
<style>
:root{--bg:#080d14;--surface:#0f1720;--border:#1a2535;--green:#00ff88;--text:#e2e8f0;--muted:#4a6080;}
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:'Syne',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;display:flex;align-items:center;justify-content:center;}
.box{background:var(--surface);border:1px solid var(--border);border-radius:20px;padding:48px;width:400px;}
.logo{text-align:center;margin-bottom:36px;}
.logo-icon{font-size:44px;}
.logo-name{font-size:26px;font-weight:800;color:var(--green);letter-spacing:-1px;margin-top:8px;}
.logo-sub{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:2px;margin-top:4px;}
.group{margin-bottom:20px;}
label{display:block;font-size:11px;text-transform:uppercase;letter-spacing:1px;color:var(--muted);margin-bottom:8px;}
input{width:100%;background:var(--bg);border:1px solid var(--border);color:var(--text);padding:12px 16px;border-radius:10px;font-size:14px;font-family:'JetBrains Mono',monospace;outline:none;transition:border .2s;}
input:focus{border-color:var(--green);}
.btn{width:100%;padding:14px;background:var(--green);color:#000;border:none;border-radius:10px;font-size:15px;font-weight:700;font-family:'Syne',sans-serif;cursor:pointer;margin-top:8px;transition:all .2s;}
.btn:hover{background:#00e87a;transform:translateY(-1px);}
.error{background:rgba(239,68,68,.1);border:1px solid rgba(239,68,68,.3);color:#fc8181;padding:10px 14px;border-radius:8px;font-size:13px;margin-bottom:20px;text-align:center;}
.success{background:rgba(0,255,136,.1);border:1px solid rgba(0,255,136,.3);color:var(--green);padding:10px 14px;border-radius:8px;font-size:13px;margin-bottom:20px;text-align:center;}
</style>
</head>
<body>
<div class="box">
  <div class="logo">
    <div class="logo-icon">⚡</div>
    <div class="logo-name">AcidCouponBot</div>
    <div class="logo-sub">Admin Dashboard</div>
  </div>
  <div id="err" class="error" style="display:none">Invalid username or password.</div>
  <div id="out" class="success" style="display:none">Signed out successfully.</div>
  <form method="POST" action="/login">
    <div class="group">
      <label>Username</label>
      <input type="text" name="username" placeholder="admin" autocomplete="username" required autofocus/>
    </div>
    <div class="group">
      <label>Password</label>
      <input type="password" name="password" placeholder="••••••••" autocomplete="current-password" required/>
    </div>
    <button type="submit" class="btn">Sign In →</button>
  </form>
</div>
<script>
const p=new URLSearchParams(location.search);
if(p.get('error')) document.getElementById('err').style.display='block';
if(p.get('logout')) document.getElementById('out').style.display='block';
</script>
</body>
</html>
