# ============================================================
# AcidCouponBot ? PRODUCTION Profile
# Activated by: SPRING_PROFILES_ACTIVE=prod in /opt/acid/coupon-bot/.env
# All secrets come from env vars ? NEVER hardcode here
# ============================================================

# ??? Server ?????????????????????????????????????????????????
server.port=8090

# ??? PostgreSQL (shared acidls-postgres container) ??????????
spring.datasource.url=${COUPON_BOT_DB_URL:jdbc:postgresql://acidls-postgres:5432/acidls_prod}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=${COUPON_BOT_DB_USER:acidls}
spring.datasource.password=${COUPON_BOT_DB_PASS}
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.h2.console.enabled=false

# ??? Infobip WhatsApp (replaces Meta/Facebook API) ??????????
# app.dev.mode=false ? real WhatsApp sends via Infobip
# Set true until Tin (Infobip support) disables old AgentOS bot
app.dev.mode=${COUPON_BOT_DEV_MODE:true}
infobip.base-url=${INFOBIP_BASE_URL:https://9rjyk4.api.infobip.com}
infobip.api-key=${INFOBIP_API_KEY}
infobip.whatsapp.sender=${INFOBIP_WHATSAPP_SENDER:27815898282}

# ??? RandGo Prod ????????????????????????????????????????????
randgo.api.url=${RANDGO_API_URL:https://api.iingxoxo.com}
randgo.username=${RANDGO_USERNAME:ACID}
randgo.password=${RANDGO_PASSWORD}
randgo.primary.key.name=Cellphone
randgo.client.scheme.guid=${RANDGO_CLIENT_SCHEME_GUID:E5B4AB2E-0464-4DDD-B51B-D686E4306334}
randgo.member.identifier.guid=${RANDGO_MEMBER_IDENTIFIER_GUID:FA90EE5C-D45C-4E4D-BAF5-41DA2D166BDE}
randgo.mock.mode=false

# ??? ACID LS Middleware ??????????????????????????????????????
middleware.base-url=${MIDDLEWARE_URL:http://acidls-api-gateway:8100}
middleware.internal-api-key=${MIDDLEWARE_INTERNAL_KEY}
middleware.enabled=true

# ??? Admin credentials ???????????????????????????????????????
admin.username=${ADMIN_USERNAME:admin}
admin.password=${ADMIN_PASSWORD}

# ??? Logging ????????????????????????????????????????????????
logging.level.com.acidcouponbot=INFO
logging.level.org.springframework.security=WARN
logging.level.org.hibernate=WARN
logging.level.com.zaxxer.hikari=WARN