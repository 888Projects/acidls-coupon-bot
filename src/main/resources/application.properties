# ============================================================
# AcidCouponBot v2.1 ? Randgo Integration
# ============================================================
spring.application.name=AcidCouponBot
# Profile set via SPRING_PROFILES_ACTIVE env var


spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# ??? WhatsApp Business API ??????????????????????????????????
whatsapp.api.url=https://graph.facebook.com/v18.0
whatsapp.phone.number.id=${WHATSAPP_PHONE_NUMBER_ID:YOUR_PHONE_NUMBER_ID}
whatsapp.access.token=${WHATSAPP_ACCESS_TOKEN:YOUR_ACCESS_TOKEN}
whatsapp.webhook.verify.token=${WHATSAPP_WEBHOOK_VERIFY_TOKEN:}
whatsapp.app.secret=${WHATSAPP_APP_SECRET:YOUR_APP_SECRET}

# ??? Randgo API ?????????????????????????????????????????????
# QA:   https://api.randgoqa.dev  (current)
# PROD: provided by Randgo after QA sign-off
randgo.api.url=${RANDGO_API_URL:https://api.randgoqa.dev}
randgo.username=${RANDGO_USERNAME:}
randgo.password=${RANDGO_PASSWORD:}
randgo.primary.key.name=${RANDGO_PRIMARY_KEY_NAME:Cellphone}
randgo.client.scheme.guid=${RANDGO_CLIENT_SCHEME_GUID:}
randgo.member.identifier.guid=${RANDGO_MEMBER_IDENTIFIER_GUID:}
randgo.mock.mode=false

# ??? Admin Dashboard ????????????????????????????????????????
admin.username=${ADMIN_USERNAME:admin}
admin.password=${ADMIN_PASSWORD:}

# ??? Logging ????????????????????????????????????????????????
logging.level.com.acidcouponbot=INFO
logging.level.org.springframework.security=WARN

# ??? ACID LS Middleware ??????????????????????????????????????????????????????
# Used to check if a WhatsApp number is a registered wallet member
# Set middleware.enabled=false in dev/test to skip the check
middleware.base-url=${MIDDLEWARE_URL:http://acidls-api-gateway:8100}
middleware.internal-api-key=${MIDDLEWARE_INTERNAL_KEY:}
middleware.enabled=${MIDDLEWARE_ENABLED:true}

# ??? Internal service-to-service API ????????????????????????
# Shared key that inbound callers (e.g. the gateway SSO flow) must present in X-Internal-Api-Key
# on /internal/**. Set INTERNAL_API_KEY to the SAME value the gateway uses. Blank => endpoint 401s.
internal.api-key=${INTERNAL_API_KEY:}

# ??? Bulk coupon campaign ???????????????????????????????????
# The RUNNER is gated by campaign.enabled (default false) — CSV upload/inspection works regardless, but a
# run only starts when this is true. Never starts by itself (no @Scheduled). See CampaignRunner.
campaign.enabled=${CAMPAIGN_ENABLED:false}
# Smaller batches are prioritised by RandGo (queue-dependent); 500 chosen after run 2 saw back-to-back
# 1000-member batches rejected (400/502). import-batch-delay-ms spaces submissions so the queue can drain.
campaign.import-batch-size=${CAMPAIGN_IMPORT_BATCH_SIZE:500}
campaign.import-batch-delay-ms=${CAMPAIGN_IMPORT_BATCH_DELAY_MS:30000}
campaign.checkout-delay-ms=${CAMPAIGN_CHECKOUT_DELAY_MS:1000}
campaign.batch-poll-interval-ms=${CAMPAIGN_BATCH_POLL_INTERVAL_MS:60000}
campaign.batch-poll-max-attempts=${CAMPAIGN_BATCH_POLL_MAX_ATTEMPTS:20}
campaign.max-consecutive-failures=${CAMPAIGN_MAX_CONSECUTIVE_FAILURES:10}
campaign.max-recipients-per-run=${CAMPAIGN_MAX_RECIPIENTS_PER_RUN:10000}